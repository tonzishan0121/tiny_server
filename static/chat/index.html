<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>tiny_server chat</title>
  <link rel="stylesheet" href="/static/chat/style.css">
</head>

<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">TS</div>
        <div>
          <h1>tiny_server chat</h1>
          <p>Desktop-style room chat</p>
        </div>
      </div>

      <section class="sidebar-card">
        <label class="field-label" for="user">Nickname</label>
        <input id="user" name="user" class="sidebar-input" placeholder="guest01" value="guest01">
      </section>

      <section class="sidebar-card">
        <div class="rooms-header">
          <span>Rooms</span>
          <div class="room-actions">
            <button id="add-room" type="button" class="ghost-button">New</button>
            <button id="rename-room" type="button" class="ghost-button">Rename</button>
            <button id="delete-room" type="button" class="ghost-button danger">Delete</button>
          </div>
        </div>
        <div id="room-list" class="room-list"></div>
        <input id="room" name="room" class="sidebar-input" placeholder="room name" value="lobby">
      </section>

      <section class="sidebar-card status-card">
        <div class="status-title">Connection</div>
        <div id="status" class="status-text">Connecting to room lobby...</div>
      </section>
    </aside>

    <main class="chat-panel">
      <header class="chat-header">
        <div>
          <div class="chat-header-label">Current room</div>
          <div id="room-title" class="chat-header-title">lobby</div>
        </div>
        <div id="room-summary" class="chat-header-summary">Loading messages...</div>
      </header>

      <section id="messages" class="messages"></section>

      <form id="chat-form" class="composer">
        <textarea id="message" name="message" placeholder="Type a message" rows="3"></textarea>
        <div class="composer-actions">
          <div class="composer-tip">Enter sends through the button so validation stays visible.</div>
          <button type="submit" class="send-button">Send</button>
        </div>
      </form>
    </main>
  </div>
  <script>(function () {
      const messagesEl = document.getElementById("messages");
      const formEl = document.getElementById("chat-form");
      const userEl = document.getElementById("user");
      const roomEl = document.getElementById("room");
      const roomListEl = document.getElementById("room-list");
      const messageEl = document.getElementById("message");
      const statusEl = document.getElementById("status");
      const roomTitleEl = document.getElementById("room-title");
      const roomSummaryEl = document.getElementById("room-summary");
      const addRoomButton = document.getElementById("add-room");
      const renameRoomButton = document.getElementById("rename-room");
      const deleteRoomButton = document.getElementById("delete-room");

      const chatEvents = new EventTarget();
      let knownRooms = [];
      let activeRoom = "lobby";
      let refreshInFlight = false;
      let refreshQueued = false;

      function escapeHtml(value) {
        return value
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;");
      }

      function formatTime(seconds) {
        return new Date(seconds * 1000).toLocaleString();
      }

      function currentRoom() {
        return activeRoom;
      }

      function inputRoom() {
        const room = roomEl.value.trim().toLowerCase();
        return room || activeRoom;
      }

      function currentUser() {
        return userEl.value.trim();
      }

      function setStatus(message, isError = false) {
        statusEl.textContent = message;
        statusEl.style.color = isError ? "#a61b3b" : "#334155";
      }

      function requestRefresh(reason) {
        chatEvents.dispatchEvent(new CustomEvent("chat:refresh", { detail: { reason } }));
      }

      function roomPreview(room) {
        if (room.last_message) {
          return `${room.last_message.user}: ${room.last_message.text}`;
        }

        return "No messages yet";
      }

      async function readApiResponse(response) {
        let payload;
        try {
          payload = await response.json();
        } catch (_) {
          return { ok: false, message: "Invalid server response", data: null };
        }

        if (!payload.ok) {
          const message = payload.error?.message || payload.message || "Request failed";
          return { ok: false, message, data: null };
        }

        return { ok: true, message: payload.message || "ok", data: payload.data };
      }

      function addKnownRoom(room) {
        if (!room || knownRooms.includes(room)) {
          return;
        }
        knownRooms.push(room);
      }

      async function loadRooms() {
        const response = await fetch("/api/rooms");
        const payload = await readApiResponse(response);
        if (!payload.ok) {
          return payload;
        }

        const rooms = Array.isArray(payload.data) ? payload.data : [];
        knownRooms = rooms.map((room) => room.name);
        addKnownRoom(currentRoom());
        return { ok: true, data: rooms };
      }

      function renderRoomList(rooms) {
        const current = currentRoom();
        const roomMap = new Map();

        for (const room of rooms) {
          addKnownRoom(room.name);
          roomMap.set(room.name, room);
        }

        roomListEl.innerHTML = knownRooms
          .map((room) => {
            const roomData = roomMap.get(room) || { name: room, message_count: 0, last_message: null };
            const activeClass = room === current ? " active" : "";
            const count = roomData.message_count || 0;
            return `
          <button type="button" class="room-item${activeClass}" data-room="${escapeHtml(room)}">
            <div>
              <div class="room-name">${escapeHtml(room)}</div>
              <div class="room-preview">${escapeHtml(roomPreview(roomData))}</div>
            </div>
            <div class="room-count">${count}</div>
          </button>
        `;
          })
          .join("");
      }

      function renderMessages(messages) {
        const current = currentRoom();
        const selfUser = currentUser();

        if (messages.length === 0) {
          messagesEl.innerHTML = `
        <div class="message system">
          <div class="message-head">
            <span class="message-user">system</span>
            <span class="message-room">${escapeHtml(current)}</span>
          </div>
          <div class="message-body">No messages yet. Start the conversation.</div>
        </div>
      `;
          return;
        }

        messagesEl.innerHTML = messages
          .map((message) => {
            const selfClass = message.user === selfUser ? " self" : "";
            const systemClass = message.user === "system" ? " system" : "";
            return `
          <article class="message${selfClass}${systemClass}">
            <div class="message-head">
              <span class="message-user">${escapeHtml(message.user)}</span>
              <span class="message-room">${escapeHtml(message.room)}</span>
              <span class="message-time">${formatTime(message.created_at_secs)}</span>
            </div>
            <div class="message-body">${escapeHtml(message.text)}</div>
          </article>
        `;
          })
          .join("");

        messagesEl.scrollTop = messagesEl.scrollHeight;
      }

      async function refreshChatView() {
        if (refreshInFlight) {
          refreshQueued = true;
          return;
        }

        refreshInFlight = true;
        const room = currentRoom();
        roomTitleEl.textContent = room;

        try {
          const roomsPayload = await loadRooms();
          if (!roomsPayload.ok) {
            setStatus(roomsPayload.message || "Failed to load rooms.", true);
            return;
          }

          const response = await fetch(`/api/messages?room=${encodeURIComponent(room)}`);
          const payload = await readApiResponse(response);
          if (!payload.ok) {
            renderRoomList(roomsPayload.data);
            roomSummaryEl.textContent = "Room unavailable";
            setStatus(payload.message, true);
            return;
          }

          const messages = Array.isArray(payload.data) ? payload.data : [];

          renderRoomList(roomsPayload.data);
          renderMessages(messages);
          roomSummaryEl.textContent = `${messages.length} message${messages.length === 1 ? "" : "s"} in this room`;
          setStatus(`Connected to room ${room}.`);
        } catch (_) {
          setStatus("Failed to reach chat server.", true);
        } finally {
          refreshInFlight = false;
          if (refreshQueued) {
            refreshQueued = false;
            requestRefresh("queued");
          }
        }
      }

      async function submitMessage(event) {
        event.preventDefault();
        setStatus("Sending message...");

        const room = currentRoom();
        const body = new URLSearchParams({
          room,
          user: currentUser(),
          message: messageEl.value,
        });

        const response = await fetch("/api/messages", {
          method: "POST",
          headers: {
            "Content-Type": "application/x-www-form-urlencoded",
          },
          body,
        });

        const payload = await readApiResponse(response);
        if (payload.ok) {
          addKnownRoom(room);
          messageEl.value = "";
          requestRefresh("message-created");
          return;
        }

        setStatus(payload.message || "Failed to send message.", true);
      }

      function bindRoomInteractions() {
        roomListEl.addEventListener("click", async (event) => {
          const button = event.target.closest("[data-room]");
          if (!button) {
            return;
          }

          activeRoom = button.dataset.room || "lobby";
          roomEl.value = activeRoom;
          renderRoomList(knownRooms.map((name) => ({ name })));
          requestRefresh("room-selected");
        });

        addRoomButton.addEventListener("click", async () => {
          const room = inputRoom();
          const response = await fetch("/api/rooms", {
            method: "POST",
            headers: {
              "Content-Type": "application/x-www-form-urlencoded",
            },
            body: new URLSearchParams({ room }),
          });
          const payload = await readApiResponse(response);
          if (!payload.ok) {
            setStatus(payload.message, true);
            return;
          }

          const createdRoom = payload.data?.name || room;
          activeRoom = createdRoom;
          roomEl.value = createdRoom;
          addKnownRoom(createdRoom);
          messageEl.focus();
          requestRefresh("room-created");
        });

        renameRoomButton.addEventListener("click", async () => {
          const oldRoom = currentRoom();
          const newRoom = inputRoom();
          const response = await fetch("/api/rooms/rename", {
            method: "POST",
            headers: {
              "Content-Type": "application/x-www-form-urlencoded",
            },
            body: new URLSearchParams({ room: oldRoom, new_room: newRoom }),
          });
          const payload = await readApiResponse(response);
          if (!payload.ok) {
            setStatus(payload.message, true);
            return;
          }

          activeRoom = payload.data?.name || newRoom;
          roomEl.value = activeRoom;
          requestRefresh("room-renamed");
        });

        deleteRoomButton.addEventListener("click", async () => {
          const room = currentRoom();
          const response = await fetch("/api/rooms/delete", {
            method: "POST",
            headers: {
              "Content-Type": "application/x-www-form-urlencoded",
            },
            body: new URLSearchParams({ room }),
          });
          const payload = await readApiResponse(response);
          if (!payload.ok) {
            setStatus(payload.message, true);
            return;
          }

          activeRoom = "lobby";
          roomEl.value = activeRoom;
          requestRefresh("room-deleted");
        });
      }

      chatEvents.addEventListener("chat:refresh", () => {
        refreshChatView();
      });

      formEl.addEventListener("submit", submitMessage);
      bindRoomInteractions();
      requestRefresh("init");
    })();
  </script>
</body>

</html>
