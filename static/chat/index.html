<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>tiny_server chat</title>
  <style>
    body {
      font-family: "Trebuchet MS", sans-serif;
      background: linear-gradient(135deg, #f3efe6, #dde8f3);
      color: #1f2933;
      margin: 0;
      padding: 24px;
    }
    .app {
      max-width: 760px;
      margin: 0 auto;
      background: rgba(255, 255, 255, 0.92);
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 18px 45px rgba(31, 41, 51, 0.12);
    }
    h1 {
      margin-top: 0;
    }
    #messages {
      min-height: 260px;
      max-height: 420px;
      overflow-y: auto;
      border: 1px solid #d5dde5;
      border-radius: 12px;
      padding: 16px;
      background: #f9fbfd;
      margin-bottom: 16px;
    }
    .message {
      padding: 10px 12px;
      border-radius: 10px;
      background: white;
      border: 1px solid #e3e8ee;
      margin-bottom: 10px;
    }
    .message strong {
      display: inline-block;
      margin-bottom: 6px;
    }
    form {
      display: grid;
      gap: 10px;
    }
    input, textarea, button {
      font: inherit;
      border-radius: 10px;
      border: 1px solid #c7d0d9;
      padding: 10px 12px;
    }
    button {
      cursor: pointer;
      background: #1f6feb;
      color: white;
      border: none;
    }
  </style>
</head>
<body>
  <div class="app">
    <h1>tiny_server chat</h1>
    <p>A small chat room built on top of the hand-made web server.</p>
    <div id="messages"></div>
    <form id="chat-form">
      <input id="user" name="user" placeholder="Your name" value="guest">
      <textarea id="message" name="message" placeholder="Say something" rows="3"></textarea>
      <button type="submit">Send</button>
    </form>
  </div>
  <script>
    const messagesEl = document.getElementById("messages");
    const formEl = document.getElementById("chat-form");
    const userEl = document.getElementById("user");
    const messageEl = document.getElementById("message");

    function renderMessages(messages) {
      messagesEl.innerHTML = messages.map((message) => `
        <div class="message">
          <strong>${escapeHtml(message.user)}</strong>
          <div>${escapeHtml(message.text)}</div>
        </div>
      `).join("");
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function escapeHtml(value) {
      return value
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    async function loadMessages() {
      const response = await fetch("/api/messages");
      const messages = await response.json();
      renderMessages(messages);
    }

    formEl.addEventListener("submit", async (event) => {
      event.preventDefault();
      const body = new URLSearchParams({
        user: userEl.value,
        message: messageEl.value,
      });

      const response = await fetch("/api/messages", {
        method: "POST",
        headers: {
          "Content-Type": "application/x-www-form-urlencoded",
        },
        body,
      });

      if (response.ok) {
        messageEl.value = "";
        await loadMessages();
      }
    });

    loadMessages();
    setInterval(loadMessages, 2000);
  </script>
</body>
</html>
