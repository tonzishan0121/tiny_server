routes:
  - method: GET
    path: /
    handler: home
    match: exact
    priority: 100
  - method: GET
    path: /health
    handler: health
    match: exact
    priority: 100
  - method: GET
    path: /index.html
    handler: static_index
    match: exact
    priority: 100
  - method: GET
    path: /static/
    handler: static
    match: prefix
    priority: 100
  - method: POST
    path: /echo
    handler: echo
    match: exact
    priority: 100
